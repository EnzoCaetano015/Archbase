name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go-version: "1.26.x"
          - os: windows-latest
            go-version: "1.26.x"
          - os: macos-latest
            go-version: "1.26.x"
          - os: ubuntu-latest
            go-version: "1.27.x"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: go build -trimpath ./cmd/arc
