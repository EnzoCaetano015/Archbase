schemaVersion: 1
id: react/component@5217
name: Reusable typed React component
description: Domain-neutral reusable component bundle separating rendering, props, styles, and public export.
type: pattern-bundle
version: 1.0.1
structure:
  root: "{{Name}}"
  files:
  - format: markdown-code
    source: Example/Example.tsx.md
    destination: "{{Name}}/{{Name}}.tsx"
    required: true
  - format: markdown-code
    source: Example/Example.types.ts.md
    destination: "{{Name}}/{{Name}}.types.ts"
    required: true
  - format: markdown-code
    source: Example/Example.styles.ts.md
    destination: "{{Name}}/{{Name}}.styles.ts"
    required: false
  - format: markdown-code
    source: Example/index.ts.md
    destination: "{{Name}}/index.ts"
    required: false
allowedChanges:
- identifiers
- imports
- props
- rendered-content
- accessibility-labels
- styles
preserve:
- typed-props
- named-export
- presentation-responsibility
- theme-token-styles
- optional-public-entrypoint
metadata:
  framework: react
  maturity: foundation-sample
  ui-library: material-ui
