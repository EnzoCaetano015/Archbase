schemaVersion: 1
id: react/page@6325
name: React page with colocated orchestration
description: Domain-neutral React page bundle separating rendering, page logic, form validation, and theme-aware styles.
type: pattern-bundle
version: 1.0.1
structure:
  root: "{{Name}}"
  files:
  - format: markdown-code
    source: Example/Example.tsx.md
    destination: "{{Name}}/{{Name}}.tsx"
    required: true
  - format: markdown-code
    source: Example/Example.hook.ts.md
    destination: "{{Name}}/{{Name}}.hook.ts"
    required: true
  - format: markdown-code
    source: Example/Example.schema.ts.md
    destination: "{{Name}}/{{Name}}.schema.ts"
    required: false
  - format: markdown-code
    source: Example/Example.styles.ts.md
    destination: "{{Name}}/{{Name}}.styles.ts"
    required: false
allowedChanges:
- identifiers
- imports
- rendered-content
- page-orchestration
- validation-rules
- styles
preserve:
- thin-page-rendering
- colocated-page-hook
- api-controller-delegation
- derived-state-without-effects
- optional-schema-and-styles
metadata:
  build-tool: vite
  framework: react
  maturity: foundation-sample
