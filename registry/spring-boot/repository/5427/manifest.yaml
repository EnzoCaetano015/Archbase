schemaVersion: 1
id: spring-boot/repository@5427
name: Spring Data JPA repository
description: Typed JPA repository with derived operations and an explicit pageable query for domain filtering.
type: pattern
version: 1.0.1
structure:
  root: "{{Name}}"
  files:
  - format: markdown-code
    source: ExampleRepository.java.md
    destination: "{{Name}}/{{Name}}Repository.java"
    required: true
allowedChanges:
- package
- identifiers
- entity-type
- id-type
- derived-queries
- jpql-queries
preserve:
- spring-data-interface
- typed-entity-and-id
- parameterized-query
- pagination-support
- no-application-workflow
metadata:
  framework: spring-data-jpa
  layer: persistence
  maturity: foundation-sample
