schemaVersion: 1
rules:
  - id: architecture/astro-content-site@1
    version: 1.0.0
    path: architecture/astro-content-site/1
    description: Content-oriented Astro architecture with file routes, layouts, server-rendered components, collections, and pure utilities.
  - id: architecture/dotnet-layered@1
    version: 1.0.0
    path: architecture/dotnet-layered/1
    description: Layered .NET architecture with one-way controller, service, and repository dependencies.
  - id: architecture/dotnet-multiproject@1
    version: 1.0.0
    path: architecture/dotnet-multiproject/1
    description: Multi-project ASP.NET Core architecture separating API, application, infrastructure, contracts, and scheduled jobs.
  - id: architecture/nestjs-prisma-modular@1
    version: 1.0.0
    path: architecture/nestjs-prisma-modular/1
    description: Modular NestJS API architecture with feature boundaries, validated DTOs, guards, HTTP integrations, and Prisma infrastructure.
  - id: architecture/next-feature-app-router@1
    version: 1.0.0
    path: architecture/next-feature-app-router/1
    description: Feature-oriented Next.js App Router architecture with explicit server, client, application, data, model, and validation boundaries.
  - id: architecture/next-modular@1
    version: 1.0.0
    path: architecture/next-modular/1
    description: Modular Next architecture separating pages, components, hooks, and utilities.
  - id: architecture/python-fastapi-modular@1
    version: 1.0.0
    path: architecture/python-fastapi-modular/1
    description: Modular FastAPI architecture separating transport, contracts, application logic, and persistence.
  - id: architecture/react-tailwind-modular@1
    version: 1.0.0
    path: architecture/react-tailwind-modular/1
    description: Modular React architecture with Tailwind primitives, centralized endpoints, page registry, and typed query controllers.
  - id: architecture/react-vite-modular@1
    version: 1.0.0
    path: architecture/react-vite-modular/1
    description: Modular React and Vite architecture separating pages, UI, API access, contracts, hooks, utilities, and routes.
  - id: architecture/spring-boot-layered@1
    version: 1.0.0
    path: architecture/spring-boot-layered/1
    description: Layered Java 21 Spring Boot architecture with MVC, JPA, MapStruct, JWT security, and global response policies.
