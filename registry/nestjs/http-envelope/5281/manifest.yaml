schemaVersion: 1
id: nestjs/http-envelope@5281
name: NestJS global HTTP envelope
description: Global interceptor and exception filter bundle that standardizes successful and failed HTTP responses.
type: pattern-bundle
version: 1.0.1
structure:
  root: "{{Name}}"
  files:
  - format: markdown-code
    source: response-envelope.interceptor.ts.md
    destination: "{{Name}}/response-envelope.interceptor.ts"
    required: true
  - format: markdown-code
    source: api-exception.filter.ts.md
    destination: "{{Name}}/api-exception.filter.ts"
    required: true
allowedChanges:
- identifiers
- imports
- success-envelope
- error-envelope
- exception-mapping
- logging
preserve:
- global-cross-cutting-responsibility
- typed-success-envelope
- unknown-exception-safety
- explicit-http-status
- no-feature-logic
metadata:
  framework: nestjs
  layer: transport
  maturity: foundation-sample
