schemaVersion: 1
id: nestjs/http-client@7528
name: NestJS external HTTP client
description: Injectable integration adapter encapsulating a configured HttpService and mapping remote responses to local contracts.
type: pattern-bundle
version: 1.0.1
structure:
  root: "{{Name}}"
  files:
  - format: markdown-code
    source: example-client.module.ts.md
    destination: "{{Name}}/{{Name}}.module.ts"
    required: true
  - format: markdown-code
    source: example-client.service.ts.md
    destination: "{{Name}}/{{Name}}.service.ts"
    required: true
allowedChanges:
- identifiers
- imports
- configuration-keys
- authentication-headers
- remote-paths
- response-contracts
preserve:
- dedicated-integration-module
- configured-http-client
- injectable-adapter
- remote-contract-encapsulation
- no-controller-dependency
metadata:
  framework: nestjs
  layer: integration
  library: nestjs-axios
  maturity: foundation-sample
