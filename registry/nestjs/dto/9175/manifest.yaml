schemaVersion: 1
id: nestjs/dto@9175
name: Validated NestJS DTO
description: Request contract combining runtime class-validator rules with Swagger metadata.
type: pattern
version: 1.0.1
structure:
  root: "{{Name}}"
  files:
  - format: markdown-code
    source: example.dto.ts.md
    destination: "{{Name}}/{{Name}}.dto.ts"
    required: true
allowedChanges:
- identifiers
- imports
- fields
- validators
- messages
- api-metadata
preserve:
- runtime-validation
- explicit-field-types
- transport-contract-responsibility
- no-business-logic
metadata:
  framework: nestjs
  layer: contract
  libraries: class-validator,swagger
  maturity: foundation-sample
