schemaVersion: 1
id: react-tailwind/page@6592
name: Tailwind page with colocated behavior
description: Domain-neutral React page bundle separating Tailwind rendering, page orchestration, Zod validation, and pure presentation helpers.
type: pattern-bundle
version: 1.0.1
structure:
  root: "{{Name}}"
  files:
  - format: markdown-code
    source: Example/Example.tsx.md
    destination: "{{Name}}/{{Name}}.tsx"
    required: true
  - format: markdown-code
    source: Example/Example.hook.ts.md
    destination: "{{Name}}/{{Name}}.hook.ts"
    required: true
  - format: markdown-code
    source: Example/Example.schema.ts.md
    destination: "{{Name}}/{{Name}}.schema.ts"
    required: false
  - format: markdown-code
    source: Example/Example.utils.ts.md
    destination: "{{Name}}/{{Name}}.utils.ts"
    required: false
allowedChanges:
- identifiers
- imports
- rendered-content
- page-orchestration
- validation-rules
- semantic-classes
- pure-helpers
preserve:
- thin-page-rendering
- colocated-page-hook
- ui-primitive-reuse
- api-controller-delegation
- optional-schema-and-utils
metadata:
  build-tool: vite
  framework: react
  maturity: foundation-sample
  styling: tailwind
