schemaVersion: 1
id: react-tailwind/api-controller@7251
name: Endpoint-catalog query controller
description: Domain-neutral TanStack Query hooks that combine the configured HTTP client, endpoint catalog, and direct API contracts.
type: pattern
version: 1.0.1
structure:
  root: "{{Name}}"
  files:
  - format: markdown-code
    source: example.ts.md
    destination: "{{Name}}/{{Name}}.ts"
    required: true
allowedChanges:
- identifiers
- imports
- request-types
- response-types
- query-options
- mutation-options
