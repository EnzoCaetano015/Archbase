schemaVersion: 1
id: react-tailwind/component@5463
name: Tailwind domain component
description: Domain-neutral typed component composed from shared UI primitives and semantic Tailwind tokens.
type: pattern-bundle
version: 1.0.1
structure:
  root: "{{Name}}"
  files:
  - format: markdown-code
    source: Example/Example.tsx.md
    destination: "{{Name}}/{{Name}}.tsx"
    required: true
  - format: markdown-code
    source: Example/Example.types.ts.md
    destination: "{{Name}}/{{Name}}.types.ts"
    required: true
  - format: markdown-code
    source: Example/Example.hook.ts.md
    destination: "{{Name}}/{{Name}}.hook.ts"
    required: false
  - format: markdown-code
    source: Example/Example.utils.ts.md
    destination: "{{Name}}/{{Name}}.utils.ts"
    required: false
allowedChanges:
- identifiers
- imports
- props
- rendered-content
- semantic-classes
- primitive-composition
preserve:
- typed-props
- named-export
- semantic-html
- shared-primitive-reuse
- domain-component-boundary
metadata:
  framework: react
  maturity: foundation-sample
  styling: tailwind
  ui-system: shadcn
