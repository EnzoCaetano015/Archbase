schemaVersion: 1
id: next/page@1234
name: Page with hook and utilities
description: Minimal, domain-neutral page bundle for the foundation registry.
type: pattern-bundle
version: 1.0.1
structure:
  root: "{{Name}}"
  files:
  - format: markdown-code
    source: Example/Example.tsx.md
    destination: "{{Name}}/{{Name}}.tsx"
    required: true
  - format: markdown-code
    source: Example/Example.hook.ts.md
    destination: "{{Name}}/{{Name}}.hook.ts"
    required: true
  - format: markdown-code
    source: Example/Example.utils.ts.md
    destination: "{{Name}}/{{Name}}.utils.ts"
    required: true
allowedChanges:
- identifiers
- imports
- types
- business-logic
- rendered-content
preserve:
- file-relationships
- declaration-order
- export-style
- hook-responsibilities
- utility-responsibilities
metadata:
  maturity: foundation-sample
