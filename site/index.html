<!doctype html>
<html lang="en">
  <head>

    <meta charset="UTF-8" />
    <style>html[data-docs-route="true"] #toolindex-footer { display: none; }</style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/assets/archbase-mark.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#0b0d10" />
    <meta name="description" content="Architecture that AI coding agents can actually follow. Documentation for the Archbase CLI, catalog, MCP, and skills." />
    <link rel="canonical" href="https://archbase.caetanodev.com/" />
    <title>Archbase — Architecture and Code Standards</title>

  </head>
  <body>

    <div id="root"></div>
    <footer id="toolindex-footer"><div id="toolindex-badge">
      <a href="https://toolindex.net/tools/archbase?ref=badge" target="_blank" rel="noopener">
        <img src="https://toolindex.net/badge/archbase/medium.svg" alt="Archbase - Listed on Tool Index" width="180" height="50" />
      </a>
    </div></footer>
    <script>
      const restoredPath = sessionStorage.getItem('archbase-path')
      if (restoredPath) {
        sessionStorage.removeItem('archbase-path')
        history.replaceState({}, '', restoredPath)
      }
      document.documentElement.dataset.docsRoute = String(location.pathname.startsWith('/docs/'))
    </script>
    <script type="module" src="/src/main.tsx"></script>

  </body>
</html>
